services:
  # ── Full-stack: Express serves React + API + Socket.IO ───────
  - type: web
    name: safeguard-api
    runtime: node
    rootDir: server
    buildCommand: chmod +x build.sh && bash build.sh
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard from Neon
      - key: CLIENT_URL
        value: https://safeguard-api-5cii.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://safeguard-api-5cii.onrender.com
