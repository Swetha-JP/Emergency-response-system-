services:
  # ── Backend API + Frontend (served together) ─────────────────
  - type: web
    name: safeguard-api
    runtime: node
    rootDir: server
    buildCommand: cd /opt/render/project/src/client && npm ci && npm run build && cd /opt/render/project/src/server && npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        value: https://safeguard-api-5cii.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://safeguard-api-5cii.onrender.com
      - key: REACT_APP_API_URL
        value: https://safeguard-api-5cii.onrender.com/api
      - key: REACT_APP_SOCKET_URL
        value: https://safeguard-api-5cii.onrender.com

  # ── Frontend React App ───────────────────────────────────────
  - type: web
    name: safeguard-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_SOCKET_URL
        sync: false

databases:
  - name: safeguard-db
    databaseName: emergency_platform
    user: safeguard_user
    plan: free
